{% extends "base.html" %}{% block title %}Sedes{% endblock %}{% block content %}
<div class="page-header"><h2><i class="fas fa-building"></i> Sedes</h2><div><a href="{% url 'espacios:sede_crear' %}" class="btn btn-primary me-2"><i class="fas fa-plus me-1"></i> Nueva Sede</a><a href="{% url 'espacios:aula_lista' %}" class="btn btn-outline-primary"><i class="fas fa-door-open me-1"></i> Ver Aulas</a></div></div>
<div class="card"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>#</th><th>Sede</th><th>Dirección</th><th>Aulas</th><th>Acciones</th></tr></thead><tbody>
{% for sede in sedes %}<tr><td>{{ forloop.counter }}</td><td><strong>{{ sede.nombre }}</strong></td><td>{{ sede.direccion }}</td><td><span class="badge bg-primary">{{ sede.aulas.count }}</span></td><td><a href="{% url 'espacios:sede_editar' sede.pk %}" class="btn btn-sm btn-outline-primary btn-icon"><i class="fas fa-edit"></i></a></td></tr>
{% empty %}<tr><td colspan="5" class="text-center text-muted py-4">No hay sedes.</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
