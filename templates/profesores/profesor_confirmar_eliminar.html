{% extends "base.html" %}
{% block title %}Eliminar Profesor{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;margin:40px auto;"><div class="card-body text-center">
<i class="fas fa-exclamation-triangle text-danger" style="font-size:3rem;"></i>
<h4 class="mt-3">¿Eliminar profesor?</h4><p class="text-muted">Está a punto de eliminar a <strong>{{ profesor.nombres }}</strong>.</p>
<form method="post">{% csrf_token %}<a href="{% url 'profesores:lista' %}" class="btn btn-outline-secondary me-2">Cancelar</a><button type="submit" class="btn btn-danger"><i class="fas fa-trash me-1"></i> Eliminar</button></form>
</div></div>{% endblock %}
