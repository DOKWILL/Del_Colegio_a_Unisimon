{% extends "base.html" %}{% block title %}Configuración{% endblock %}{% block content %}
<div class="page-header"><h2><i class="fas fa-cog"></i> Configuración del Sistema</h2></div>
<div class="card" style="max-width:600px;"><div class="card-body">
<form method="post" novalidate>{% csrf_token %}
<div class="mb-3"><label class="form-label">{{ form.nota_minima.label }}</label>{{ form.nota_minima }}<small class="form-text text-muted">Valor actual: <strong>{{ nota_minima }}</strong> sobre 5.0. Los estudiantes con nota definitiva inferior serán marcados como "Reprobado".</small></div>
<button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Guardar Configuración</button></form></div></div>{% endblock %}
