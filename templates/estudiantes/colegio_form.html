{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="fas fa-school"></i> {{ titulo }}</h2></div>
<div class="card"><div class="card-body">
<form method="post" novalidate>{% csrf_token %}
<div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}</div>{% endfor %}</div>
<div class="mt-4"><button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> {{ accion }}</button> <a href="{% url 'estudiantes:colegio_lista' %}" class="btn btn-outline-secondary ms-2">Cancelar</a></div>
</form></div></div>
{% endblock %}
